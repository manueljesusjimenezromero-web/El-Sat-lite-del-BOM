<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satélite</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      background: #f8fafc;
      color: #0f172a;
    }

    h1 { margin: 0; font-size: 1.2rem; }

    #bienvenida { margin: 0; font-size: .95rem; color: #2563eb; }

    #cuentaAtras { margin: 0; min-height: 1.2em; font-weight: 600; color: #dc2626; }

    button {
      padding: .55rem .8rem;
      font-size: .9rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: default; }

    #btnDestruir { background: #dc2626; }
    #btnDestruir:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <h1>Ventana satélite</h1>
  <p id="bienvenida"></p>

  <button onclick="redirigirConHistorial()" id="btnCon">Redirigir con Historial</button>
  <button onclick="redirigirSinHistorial()" id="btnSin">Redirigir sin Historial</button>
  <button onclick="autodestruccion()" id="btnDestruir">Autodestrucción en 5 segundos</button>

  <p id="cuentaAtras"></p>

  <script>
    const URL_ILERNA = "https://www.ilerna.es";
    const parrafoCuentaAtras =document.getElementById("cuentaAtras")
    const agenteUsuario = navigator.userAgent;
    let sistemaOperativo = "un sistema desconocido";

    if (agenteUsuario.indexOf("Windows") !== -1) {
      sistemaOperativo = "Windows";
    } else if (agenteUsuario.indexOf("Mac") !== -1) {
      sistemaOperativo = "Mac";
    } else if (agenteUsuario.indexOf("Linux") !== -1) {
      sistemaOperativo = "Linux";
    }
    document.getElementById("bienvenida").textContent = "¡Bienvenido! Estás navegando desde " + sistemaOperativo + ".";
    function hayVentanaMadre() {
      if (!window.opener || window.opener.closed) {
        alert("No hay ventana madre. Abre esta página desde index.html.");
        return false;
      }
      return true;
    };
    function redirigirConHistorial(){
      if (hayVentanaMadre()) {
        window.opener.location.assign(URL_ILERNA);
      }
    };
    function redirigirSinHistorial(){
      if (hayVentanaMadre()) {
        window.opener.location.replace(URL_ILERNA);
      }
    };


    function autodestruccion(segundosRestantes=5){
      if (segundosRestantes == 0) {
        parrafoCuentaAtras.textContent = "¡Adiós!";
        setTimeout(function () {
          window.close();              
          return;
        }, 1000);
      }
      else {
        parrafoCuentaAtras.textContent = "Autodestrucción en " + segundosRestantes + "...";
        setTimeout(function () {
          autodestruccion(segundosRestantes - 1);    
        }, 1000);
      }
      
      
    };
  </script>
</body>
</html>
